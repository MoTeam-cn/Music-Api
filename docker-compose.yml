# 默认走南京大学 GHCR 镜像（国内拉取更快）；官方地址 ghcr.io/moteam-cn/music-api 同样可用。
services:
  music-api:
    image: ghcr.nju.edu.cn/moteam-cn/music-api:latest
    # build: .
    container_name: music-api
    restart: unless-stopped
    ports:
      - "21983:8802"
    environment:
      HOST: 0.0.0.0
      PORT: "8802"
      LOG_LEVEL: info
      RATE_LIMIT: "60"
      RATE_BURST: "10"
      CACHE_MAX: "500"
      TRUST_PROXY: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8802/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
