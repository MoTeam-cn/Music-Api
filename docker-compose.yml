# 直接使用 GHCR 镜像；如需本地构建，把 image 换成 build: .
services:
  music-api:
    image: ghcr.io/moteam-cn/music-api:latest
    # build: .
    container_name: music-api
    restart: unless-stopped
    ports:
      - "8802:8802"
    environment:
      HOST: 0.0.0.0
      PORT: "8802"
      LOG_LEVEL: info
      RATE_LIMIT: "60"
      RATE_BURST: "10"
      CACHE_MAX: "500"
      TRUST_PROXY: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8802/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
